name: Oracle Always Free VPS

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check Oracle without submitting Apply
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: oracle-existing-stack-apply
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'gennadygennady/oracle-vps-autoprovision' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Oracle SDK
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test safety decisions
        run: python -m unittest discover -s tests -v
      - name: Check Stack and attempt Apply
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_STACK_ID: ${{ secrets.OCI_STACK_ID }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python provision.py --dry-run
          else
            python provision.py
          fi
      - name: Stop on unexpected runner/setup failure
        if: failure() && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/provision.yml/disable"
      - name: Save safe diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safe-diagnostic-${{ github.run_id }}
          path: diagnostic.json
          if-no-files-found: ignore
          retention-days: 7
